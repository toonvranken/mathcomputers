# Nginx reverse proxy voor MathComputers (Next.js op poort 3000)
# Installeer als: /etc/nginx/sites-available/mathcomputers.be
# ln -s ... /etc/nginx/sites-enabled/
# certbot --nginx -d mathcomputers.be -d www.mathcomputers.be

# Redirect www → apex (of omgekeerd, kies één canonical)
server {
    listen 80;
    listen [::]:80;
    server_name www.mathcomputers.be;
    return 301 https://mathcomputers.be$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mathcomputers.be;

    # Certbot vult HTTPS bij; tijdelijk HTTP doorsturen naar app of SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mathcomputers.be$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mathcomputers.be;

    # ssl_certificate /etc/letsencrypt/live/mathcomputers.be/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mathcomputers.be/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Uploads / statische bestanden mogen groot genoeg zijn voor logo
    client_max_body_size 5m;

    # Admin niet cachen
    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
